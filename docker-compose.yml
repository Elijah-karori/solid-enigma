version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ont-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ont_inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: ont-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ont-api
    restart: always
    environment:
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/ont_inventory?sslmode=disable"
      PORT: "8080"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_FROM: "noreply@ont.co.ke"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mailpit

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ont-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
